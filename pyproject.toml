[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-inventory-toolkit"
version = "0.2.1"
description = "Collect, validate and reconcile a YAML inventory into NetBox"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Blalange" }]
keywords = ["netbox", "inventory", "dcim", "ipam", "snmp", "ipmi", "yaml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "pynetbox>=7.9.0",
  "PyYAML>=6.0.3",
  "requests>=2.32.5",
]

[project.optional-dependencies]
snmp = ["pysnmp==7.1.22"]
lsp = ["pygls>=2.1,<3", "lsprotocol"]
all = ["pysnmp==7.1.22", "pygls>=2.1,<3", "lsprotocol"]

[project.scripts]
netbox-inventory-toolkit = "netbox_inventory_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/Blalange/netbox-inventory-toolkit"
Issues = "https://github.com/Blalange/netbox-inventory-toolkit/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
